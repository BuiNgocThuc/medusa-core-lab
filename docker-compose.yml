services:
  postgres:
    image: postgres:15-alpine
    container_name: medusa_core_lab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medusa_core_lab_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medusa_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d medusa_core_lab_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: medusa_core_lab_redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    networks:
      - medusa_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  medusa_network:
    driver: bridge

